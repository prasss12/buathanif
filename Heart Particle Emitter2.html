<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    overflow:hidden;
    height:100vh;
}

.word{
    position:absolute;
    color:#ff3366;
    font-family:Arial, sans-serif;
    font-weight:bold;
    font-size:18px;
    text-shadow:0 0 10px #ff3366;
    white-space:nowrap;
}
</style>
</head>
<body>

<script>
const totalWords = 120;
const words = [];

for(let i=0;i<totalWords;i++){
    const div = document.createElement("div");
    div.className = "word";
    div.innerText = "I LOVE YOU ❤️";
    document.body.appendChild(div);
    words.push(div);
}

function heart(t){
    const x = 16 * Math.pow(Math.sin(t),3);
    const y = -(13*Math.cos(t)
            -5*Math.cos(2*t)
            -2*Math.cos(3*t)
            -Math.cos(4*t));
    return {x,y};
}

function animate(){
    const time = Date.now() * 0.0003;

    words.forEach((word,index)=>{

        const t = ((index/totalWords) * Math.PI * 2 + time) % (Math.PI*2);

        const p = heart(t);

        const scale = 18;

        const x = window.innerWidth/2 + p.x * scale;
        const y = window.innerHeight/2 + p.y * scale;

        word.style.left = x + "px";
        word.style.top = y + "px";
    });

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
